resources:
  jobs:
    lensdata_job:
      name: lensdata_job
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
      - task_key: bronze_publicaciones
        notebook_task:
          notebook_path: ../notebooks/bronze/01_ingestar_publicaciones.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
      - task_key: bronze_mediciones
        notebook_task:
          notebook_path: ../notebooks/bronze/02_ingestar_mediciones.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
        depends_on:
        - task_key: bronze_publicaciones
      - task_key: silver_transformar
        notebook_task:
          notebook_path: ../notebooks/silver/01_transformar_silver.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
        depends_on:
        - task_key: bronze_mediciones
      - task_key: silver_merge
        notebook_task:
          notebook_path: ../notebooks/silver/02_merge_mediciones.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
        depends_on:
        - task_key: silver_transformar
      - task_key: gold_generar
        notebook_task:
          notebook_path: ../notebooks/gold/01_generar_gold.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
        depends_on:
        - task_key: silver_merge
      - task_key: gold_validar
        notebook_task:
          notebook_path: ../tests/test_gold.ipynb
          base_parameters:
            project_root: ${workspace.file_path}
        depends_on:
        - task_key: gold_generar
      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/workspace/lensdata_bronze/archivos/recepcion/mediciones/
          min_time_between_triggers_seconds: 900
          wait_after_last_change_seconds: 60
